[project]
name = "sentinelrx"
version = "0.5.0"
description = "Evidence-grounded medication-transition safety for synthetic FHIR R4 records"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.49,<2",
  "pandas>=2.2,<3",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["sentinelrx"]

[tool.setuptools.package-data]
sentinelrx = ["data/*.json"]
